<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sedang Offline - VoucherHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#16a34a">
  <!--
    Intentionally no Tailwind/Lucide/Chart.js CDN and no css/style.css
    link here. This page must render correctly even on a first-ever
    offline visit, before anything else has had a chance to be cached —
    so every style it needs is inline, and the icon below is inline SVG
    rather than a Lucide CDN icon. See Phase 3 spec Step 4: "No external
    dependencies required to render the basic page."
  -->
  <style>
    :root{
      --green-600: #16a34a;
      --green-700: #15803d;
      --green-800: #14532d;
      --ink-900: #0f172a;
      --ink-500: #64748b;
      --line: #e5e7eb;
    }
    *{ box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body{ height: 100%; margin: 0; }
    body{
      font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink-900);
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card{
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 8px 24px -12px rgba(15,23,42,.10);
      padding: 40px 32px;
    }
    .offline-icon{
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      border-radius: 14px;
      background: var(--green-600);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--ink-900);
      margin-bottom: 18px;
    }
    h1{ font-size: 1.25rem; margin: 0 0 10px; }
    p{ color: var(--ink-500); font-size: .9375rem; line-height: 1.55; margin: 0 0 24px; }
    button{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      width: 100%;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: .9375rem;
      padding: .75rem 1.5rem;
      background: var(--green-700);
      color: #fff;
      cursor: pointer;
      transition: background .15s ease;
    }
    button:hover{ background: var(--green-800); }
    button:active{ transform: translateY(1px); }
    .hint{ margin-top: 16px; font-size: .8125rem; color: var(--ink-500); }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <!-- inline SVG, no CDN icon font needed -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 8.5C9.5 4.5 14.5 4.5 19 8.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M7.5 11.5C10.5 8.8 13.5 8.8 16.5 11.5" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
        <line x1="4" y1="4" x2="20" y2="20" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand">
      <span>VoucherHub</span>
    </div>
    <h1>Anda sedang offline</h1>
    <p>
      Halaman ini belum pernah dimuat sebelumnya, jadi belum tersimpan untuk
      mode offline. Halaman yang <strong>pernah Anda buka sebelumnya</strong>
      tetap bisa diakses selama offline, dan data yang ditampilkan mungkin
      tidak yang terbaru.
    </p>
    <button id="retryBtn" type="button">Coba Lagi</button>
    <p class="hint" id="statusHint">Memeriksa koneksi&hellip;</p>
  </div>

  <script>
    // No dependency on pwa-register.js — this page must work standalone.
    var hint = document.getElementById('statusHint');
    function updateHint() {
      hint.textContent = navigator.onLine
        ? 'Koneksi terdeteksi — klik Coba Lagi.'
        : 'Belum ada koneksi internet.';
    }
    updateHint();
    window.addEventListener('online', updateHint);
    window.addEventListener('offline', updateHint);

    document.getElementById('retryBtn').addEventListener('click', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
