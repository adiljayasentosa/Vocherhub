<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - VoucherHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-white text-slate-900">

  <div class="min-h-screen grid lg:grid-cols-2">

    <!-- ============ LEFT: FORM ============ -->
    <div class="flex flex-col justify-center px-6 sm:px-10 lg:px-20 py-12">
      <div class="max-w-sm w-full mx-auto">
        <a href="index.html" class="flex items-center gap-2 font-bold text-lg mb-10">
          <i data-lucide="wifi" class="text-green-600" style="width:22px;height:22px"></i>
          VoucherHub
        </a>

        <h1 class="text-2xl font-extrabold flex items-center gap-2">Selamat Datang Kembali! <span aria-hidden="true">👋</span></h1>
        <p class="text-slate-500 mt-1 mb-8 text-sm">Silakan login untuk melanjutkan</p>

        <div id="loginError" class="hidden mb-5 flex items-start gap-2 rounded-xl bg-red-50 border border-red-100 text-red-700 text-sm px-4 py-3">
          <i data-lucide="alert-circle" style="width:16px;height:16px" class="mt-0.5 shrink-0"></i>
          <span id="loginErrorText">Terjadi kesalahan.</span>
        </div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium mb-1.5">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" placeholder="Masukkan email"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm focus:border-green-600 focus:ring-1 focus:ring-green-600 outline-none">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium mb-1.5">Password</label>
            <div class="relative">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password"
                class="w-full rounded-xl border border-slate-200 px-4 py-3 pr-11 text-sm focus:border-green-600 focus:ring-1 focus:ring-green-600 outline-none">
              <button type="button" id="togglePassword" aria-label="Tampilkan password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i data-lucide="eye" style="width:18px;height:18px"></i>
              </button>
            </div>
          </div>

          <div class="text-right">
            <a href="#" class="text-sm font-medium text-green-700 hover:underline">Lupa Password?</a>
          </div>

          <button type="submit" id="loginSubmitBtn" class="vh-btn vh-btn-primary w-full">Login</button>
        </form>

        <p class="flex items-center gap-2 justify-center text-xs text-slate-400 mt-8">
          <i data-lucide="settings" style="width:14px;height:14px"></i>
          Akses terbatas untuk operator yang telah terdaftar.
        </p>
      </div>
    </div>

    <!-- ============ RIGHT: ILLUSTRATION ============ -->
    <div class="vh-security-panel flex flex-col items-center justify-center px-10 py-16 text-center">
      <div class="w-32 h-32 rounded-full bg-green-100/70 flex items-center justify-center mb-8 relative">
        <div class="w-24 h-24 rounded-full bg-green-600/90 flex items-center justify-center">
          <i data-lucide="shield" class="text-white" style="width:38px;height:38px"></i>
        </div>
        <i data-lucide="lock" class="text-green-700 absolute" style="width:22px;height:22px; top:8px; right:4px"></i>
        <i data-lucide="sparkles" class="text-green-400 absolute" style="width:16px;height:16px; bottom:6px; left:0"></i>
      </div>
      <h2 class="text-xl font-extrabold">Sistem Aman &amp; Terpercaya</h2>
      <p class="text-slate-500 text-sm mt-2 max-w-xs">Data sekolah Anda aman bersama kami.</p>
    </div>

  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
